name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "metrics.svg"
      - "metrics.plugin.isocalendar.svg"
      - "metrics.plugin.achievements.svg"
      - "metrics.plugin.habits.svg"

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    name: Generate metrics
    runs-on: ubuntu-latest
    steps:
      # Check out the repo so we can commit generated SVGs
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 1. Main metrics card
      # ---------------------------------------------------------
      - name: Main metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: BanshwarTech
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          output_action: none

          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell, batchfile
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph

      # ---------------------------------------------------------
      # 2. 3D Contribution Calendar (full year)
      # ---------------------------------------------------------
      - name: Isocalendar (3D contributions)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.svg
          user: BanshwarTech
          base: ""
          config_timezone: Asia/Kolkata
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------------------------------------------------
      # 3. Achievements
      # ---------------------------------------------------------
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.achievements.svg
          user: BanshwarTech
          base: ""
          config_timezone: Asia/Kolkata
          output_action: none
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # ---------------------------------------------------------
      # 4. Coding Habits
      # ---------------------------------------------------------
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.habits.svg
          user: BanshwarTech
          base: ""
          config_timezone: Asia/Kolkata
          output_action: none
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ---------------------------------------------------------
      # Diagnostic: confirm files were generated
      # ---------------------------------------------------------
      - name: Verify generated files
        run: |
          echo "=== Generated SVG files ==="
          ls -lh metrics*.svg 2>/dev/null || echo "❌ NO SVG FILES FOUND — metrics generation failed"
          echo ""
          echo "=== File sizes ==="
          du -h metrics*.svg 2>/dev/null || true

      # ---------------------------------------------------------
      # Commit and push SVGs back to repo
      # Uses default GITHUB_TOKEN (always has contents:write here)
      # ---------------------------------------------------------
      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg metrics.plugin.*.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "✅ No changes to commit (metrics unchanged)"
          else
            git commit -m "chore(metrics): update GitHub stats SVGs [skip ci]"
            git push
            echo "✅ Pushed updated metrics SVGs"
          fi
