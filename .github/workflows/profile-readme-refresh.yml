name: Refresh Developer Profile README

on:
  schedule:
    # GitHub cron cannot express every 15 days exactly; run on the 1st and 16th.
    - cron: "17 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: false

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh repository and language sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: BanshwarTech
          PROFILE_REPO: BanshwarTech/BanshwarTech
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          username = os.environ["GITHUB_USERNAME"]
          profile_repo = os.environ["PROFILE_REPO"].lower()
          token = os.environ["GITHUB_TOKEN"]
          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "profile-readme-refresh",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repos = get_json(
              f"https://api.github.com/users/{username}/repos?type=owner&sort=pushed&direction=desc&per_page=100"
          )
          public_repos = [
              repo for repo in repos
              if not repo.get("private")
              and not repo.get("fork")
              and repo.get("full_name", "").lower() != profile_repo
              and not repo.get("archived")
          ]

          recent = public_repos[:6]
          repo_lines = [
              "## Recent public repositories",
              "",
              "_Automatically refreshed from recently pushed public repositories owned by this account._",
              "",
          ]
          if recent:
              for repo in recent:
                  description = (repo.get("description") or "Public project repository").replace("\n", " ").strip()
                  if len(description) > 180:
                      description = description[:177].rstrip() + "..."
                  repo_lines.append(f"- [{repo['name']}]({repo['html_url']}) — {description}")
          else:
              repo_lines.append("_No eligible public repositories were found._")
          repo_block = "\n".join(repo_lines)

          languages = {}
          for repo in public_repos[:30]:
              try:
                  data = get_json(repo["languages_url"])
                  for language, byte_count in data.items():
                      languages[language] = languages.get(language, 0) + byte_count
              except Exception as error:
                  print(f"Skipping language stats for {repo.get('full_name')}: {error}")

          ordered_languages = [
              name for name, _ in sorted(languages.items(), key=lambda item: item[1], reverse=True)
          ][:10]
          language_block = (
              "## Technologies detected in public repositories\n\n"
              + (" · ".join(ordered_languages) if ordered_languages else "No language statistics available")
              + "\n\n_Detected using GitHub language statistics; this reflects repository code, not a self-rated proficiency level._"
          )

          def replace_section(source, start_marker, end_marker, replacement):
              start = source.find(start_marker)
              end = source.find(end_marker)
              if start == -1 or end == -1 or end < start:
                  raise SystemExit(f"Required README markers missing: {start_marker} / {end_marker}")
              return source[:start] + start_marker + "\n" + replacement + "\n\n" + end_marker + source[end + len(end_marker):]

          text = replace_section(
              text,
              "<!-- AUTO_RECENT_PROJECTS_START -->",
              "<!-- AUTO_RECENT_PROJECTS_END -->",
              repo_block,
          )
          text = replace_section(
              text,
              "<!-- AUTO_REPOSITORY_LANGUAGES_START -->",
              "<!-- AUTO_REPOSITORY_LANGUAGES_END -->",
              language_block,
          )

          if text != readme_path.read_text(encoding="utf-8"):
              readme_path.write_text(text, encoding="utf-8")
              print("README.md updated.")
          else:
              print("README.md is already up to date.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "chore: refresh developer profile README"
            git push
          fi
